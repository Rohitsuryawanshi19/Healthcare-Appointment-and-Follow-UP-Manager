version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: careflow-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: careflow
    networks:
      - careflow-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careflow-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/careflow
      - JWT_SECRET=production_super_secret_jwt_key_careflow_32_chars
      - CLIENT_URL=http://localhost
      - TRUSTED_ORIGINS=http://localhost,http://localhost:80
    depends_on:
      - mongodb
    networks:
      - careflow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careflow-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - careflow-network

networks:
  careflow-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
