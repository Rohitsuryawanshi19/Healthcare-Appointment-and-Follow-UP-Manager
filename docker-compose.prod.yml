version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: careflow-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: careflow
    networks:
      - careflow-network

  redis:
    image: redis:7-alpine
    container_name: careflow-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - careflow-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careflow-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/careflow
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=production_super_secret_jwt_key_careflow_32_chars
      - JWT_REFRESH_SECRET=production_super_secret_jwt_refresh_key_32_chars
      - CLIENT_URL=http://localhost
      - FRONTEND_URL=http://localhost
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://127.0.0.1:80
      - TRUSTED_ORIGINS=http://localhost,http://localhost:80
      - COOKIE_SAME_SITE=lax
      - COOKIE_SECURE=false
      - LLM_MODEL=gemini-flash-latest
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost/api/calendar/callback}
      - SENTRY_DSN=${SENTRY_DSN:-}
    depends_on:
      - mongodb
      - redis
    networks:
      - careflow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careflow-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - careflow-network

networks:
  careflow-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local
